# =============================================================================
# Spark 4.0.4 — configuration commune à tous les conteneurs Spark de l'atelier
# (spark-master, spark-worker, spark-history, zeppelin). Lue automatiquement par
# spark-submit / pyspark / spark-sql via SPARK_CONF_DIR=/opt/spark/conf.
# =============================================================================

# ── Cluster Spark "standalone" de l'atelier ──────────────────────────────────
spark.master                              spark://spark-master:7077

# ── Catalogue Hive partagé avec Hive / Impala / Hue ───────────────────────────
# Le metastore du cluster est un Hive 4.1.0 : le client Hive 2.3 intégré à
# Spark ne sait plus lui parler (appel Thrift get_table supprimé en Hive 4).
# On charge donc, dans un class loader isolé, le client metastore Hive 4.0.1
# embarqué dans l'image (dernière version supportée par Spark 4.0, cf. SPARK-45265).
spark.sql.catalogImplementation           hive
spark.sql.hive.metastore.version          4.0.1
spark.sql.hive.metastore.jars             path
spark.sql.hive.metastore.jars.path        file:///opt/hive-metastore-4.0.1/lib/*.jar
spark.sql.warehouse.dir                   hdfs://namenode:8020/user/hive/warehouse
# (également dans hive-site.xml ; redonné ici pour qu'il atteigne toujours le
#  client metastore isolé, qui reçoit la configuration Hadoop de Spark)
spark.hadoop.hive.metastore.uris          thrift://metastore:9083

# ── Historique des applications (Spark History Server, port 18080) ───────────
# /spark-logs est créé sur HDFS par hadoop/init-tez.sh (service tez-init).
spark.eventLog.enabled                    true
spark.eventLog.dir                        hdfs://namenode:8020/spark-logs
spark.history.fs.logDirectory             hdfs://namenode:8020/spark-logs

# ── Dimensionnement "lab" (petits jeux de données) ───────────────────────────
spark.sql.shuffle.partitions              8
spark.driver.memory                       1g
spark.executor.memory                     1g
spark.executor.cores                      1
# Chaque application prend au plus 2 cœurs du worker (4 au total) : Zeppelin et
# un spark-submit de démonstration peuvent tourner en même temps.
spark.cores.max                           2

# ── PySpark : même interpréteur Python (3.10) côté driver et côté executors ──
spark.pyspark.python                      python3
spark.pyspark.driver.python               python3
