# ---------------------------------------------------------------------------
# Atelier : copie à l'identique du fichier de Hive 4.1.0 (beeline/src/main/resources/beeline-log4j2.properties),
# chargé par : beeline (jar hive-beeline).
# Seule différence : la ligne « packages = ... » est retirée. Log4j 2.24 la
# signale comme dépréciée (« The use of package scanning to locate Log4j
# plugins is deprecated ») à chaque démarrage. Ce fichier n'utilise que des
# composants standard de Log4j : cette ligne n'y servait à rien.
# Placé dans hive-conf/, il remplace celui de l'image (HIVE_CUSTOM_CONF_DIR).
# ---------------------------------------------------------------------------

status = INFO
name = BeelineLog4j2
# packages = ... : ligne retirée (voir l'en-tête « atelier » plus haut)

# list of properties
property.hive.log.level = WARN
property.hive.root.logger = console

# list of all appenders
appenders = console

# console appender
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} [%t]: %p %c{2}: %m%n

# list of all loggers
loggers = HiveConnection, HiveJDBC

# HiveConnection logs useful info for dynamic service discovery
logger.HiveConnection.name = org.apache.hive.jdbc.HiveConnection
logger.HiveConnection.level = INFO

# all jdbc class logs can be useful while investigating connection issues, connection tracking
logger.HiveJDBC.name = org.apache.hive.jdbc
logger.HiveJDBC.level = INFO

# root logger
rootLogger.level = ${sys:hive.log.level}
rootLogger.appenderRefs = root
rootLogger.appenderRef.root.ref = ${sys:hive.root.logger}
