# =============================================================================
# Hue 4.11.0 — configuration de l'atelier
# Montée dans /usr/share/hue/desktop/conf/z-hue.ini : Hue lit tous les *.ini de
# ce répertoire par ordre alphabétique, ce fichier passe donc en dernier et
# surcharge hue.ini / z-hue-overrides.ini fournis par l'image.
# =============================================================================

[desktop]
  secret_key=atelier-hive-tez-hue-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
  http_host=0.0.0.0
  http_port=8888
  time_zone=Europe/Paris
  django_debug_mode=false
  http_500_debug_mode=false

  # Applications désactivées : services absents de l'atelier (Solr, Sentry,
  # Oozie et ses dépendances pig/jobsub, Sqoop, Livy). Liste volontairement
  # proche de celle de l'image officielle (search,hbase,security), sans
  # "hbase" pour garder l'explorateur HBase. L'importateur ("indexer") reste
  # actif : il sert à créer des tables depuis des fichiers.
  app_blacklist=search,security,oozie,jobsub,pig,sqoop,spark

  # Super-utilisateur HDFS = compte qui fait tourner le NameNode (image apache/hadoop)
  default_hdfs_superuser=hadoop

  use_cherrypy_server=false
  gunicorn_work_class=sync
  gunicorn_number_of_workers=2

  [[database]]
    engine=postgresql_psycopg2
    host=hue-db
    port=5432
    user=hue
    password=hue
    name=hue

  # Cookie de session propre à l'atelier : les cookies sont partagés par toutes
  # les applications servies sur « localhost », quel que soit le port. Le nom
  # par défaut (« sessionid ») entre en collision avec tout autre Hue/Django
  # ouvert dans le même navigateur. Le cookie CSRF est renommé de la même façon
  # dans l'image (hue/Dockerfile), son nom n'étant pas réglable ici.
  [[session]]
    cookie_name=hue_atelier_sessionid

[notebook]
  [[interpreters]]
    [[[hive]]]
      name=Hive
      interface=hiveserver2
    [[[impala]]]
      name=Impala
      interface=hiveserver2

[dashboard]
  has_sql_enabled=false

[hadoop]
  [[hdfs_clusters]]
    [[[default]]]
      fs_defaultfs=hdfs://namenode:8020
      webhdfs_url=http://namenode:9870/webhdfs/v1

  [[yarn_clusters]]
    [[[default]]]
      resourcemanager_host=resourcemanager
      resourcemanager_port=8032
      resourcemanager_api_url=http://resourcemanager:8088
      proxy_api_url=http://resourcemanager:8088

[beeswax]
  hive_server_host=hiveserver2
  hive_server_port=10000
  # Contient hive.server2.enable.doAs=false (comme le HiveServer2 de l'atelier) :
  # Hue n'envoie alors pas de hive.server2.proxy.user.
  hive_conf_dir=/etc/hive/conf

[impala]
  server_host=impalad
  server_port=21050

[hbase]
  hbase_clusters=(HBase|hbase-thrift:9090)
  thrift_transport=buffered

[zookeeper]
  [[clusters]]
    [[[default]]]
      # ZooKeeper de l'atelier (profils hbase / llap / full)
      host_ports=zookeeper:2181
